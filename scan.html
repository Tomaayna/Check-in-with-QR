<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>受付スキャン</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; background: #0d1b2a; color: #fff; }
  header { padding: 12px 16px; background: #1565c0; font-size: 16px; font-weight: bold; text-align: center; }
  .counter { padding: 10px; text-align: center; font-size: 14px; background: #102a43; }
  .counter b { font-size: 20px; color: #4fc3f7; }
  #reader { width: 100%; max-width: 480px; margin: 0 auto; }
  #result { margin: 0 auto; max-width: 480px; padding: 20px 16px; text-align: center; min-height: 120px; }
  #result.ok { background: #1b5e20; }
  #result.warn { background: #e65100; }
  #result.error { background: #b71c1c; }
  .rname { font-size: 26px; font-weight: bold; margin: 6px 0; }
  .rmsg { font-size: 15px; opacity: .9; }
  .rco { font-size: 14px; opacity: .8; }
  #err { display: none; max-width: 480px; margin: 16px auto; padding: 16px; background: #b71c1c; border-radius: 10px; font-size: 14px; line-height: 1.6; }
  #err ol { margin: 8px 0 0; padding-left: 20px; }
  #retry { margin-top: 12px; border: none; background: #fff; color: #b71c1c; font-weight: bold; border-radius: 8px; padding: 10px 20px; font-size: 15px; cursor: pointer; }
  #setup { max-width: 480px; margin: 24px auto; padding: 16px; background: #102a43; border-radius: 10px; font-size: 13px; line-height: 1.6; }
  #setup input { width: 100%; padding: 8px; border-radius: 6px; border: none; font-size: 13px; margin-top: 6px; }
  #setup button { margin-top: 10px; border: none; background: #1565c0; color: #fff; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<header>受付スキャン</header>
<div class="counter">来場 <b id="cdone">-</b> / <span id="ctotal">-</span> 名</div>
<div id="reader"></div>

<!-- Googleログイン(受付操作にはスプレッドシート共有アカウントでのログインが必要) -->
<div id="signin" style="display:none;max-width:480px;margin:24px auto;padding:20px 16px;background:#102a43;border-radius:10px;text-align:center;">
  <div style="font-size:14px;margin-bottom:14px;">受付を開始するには、名簿の共有を受けているGoogleアカウントでログインしてください。</div>
  <div id="gsiBtn" style="display:flex;justify-content:center;"></div>
  <div id="signinMsg" style="font-size:12px;color:#ffab91;margin-top:10px;"></div>
</div>
<div id="result">準備中…</div>
<div id="err"></div>

<!-- API URL が未設定の場合に表示する設定欄 -->
<div id="setup" style="display:none;">
  <div>GASウェブアプリのURL(…/exec)を入力してください。一度設定すればこの端末に保存されます。</div>
  <input id="apiInput" type="text" placeholder="https://script.google.com/macros/s/XXXX/exec">
  <button id="apiSave">保存して開始</button>
</div>

<script>
/* ============================================================
 *  受付スキャン画面(GitHub Pages版)
 *  通常は管理トップ画面の「受付スキャン」ボタンから開きます。
 *  その際 GAS が ?api=ウェブアプリURL&key=合言葉 を付けて遷移するため、
 *  このファイル(public)にウェブアプリURLを直接書く必要はありません。
 *  一度開くと api/key はこの端末に保存され、次回はパラメータ無しでも動きます。
 *
 *  【QR認識について】
 *  ネイティブの BarcodeDetector が使える端末ではそちらを優先。
 *  非対応端末は jsQR(QR専用デコーダ)で読み取る。
 *  いずれも同一値を2フレーム連続で読めたら確定する誤読防止つき。
 *
 *  【アクセス制限】
 *  受付操作にはGoogleログインが必須。許可されるのは名簿スプレッド
 *  シートに共有されているアカウントのみ(GAS側で検証・共有設定と同期)。
 *  OAuthクライアントIDは ?gcid= で受け取る(ダッシュボード経由で自動付与)。
 * ============================================================ */
var API_URL = "https://script.google.com/macros/s/AKfycbyPH7odavUyUGAdj33fNVCAbYjBRxNrPquDS7XYthbhdBd5IIxDfJ0yDYM26g-o_BE/exec"; // ← ここにGASのウェブアプリURL(…/exec)を貼り付けてもOK
var ADMIN_KEY = "tomasei-nasta-404510"; // 管理用の合言葉(?key= で渡される)
var GOOGLE_CLIENT_ID = ""; // OAuthクライアントID(?gcid= で渡される)
var idToken = ""; // Googleログインで取得するIDトークン(受付操作に必須)

// 優先順位: ①URLの ?api=/?key=/?gcid= パラメータ → ②保存済み(localStorage) → ③上の直書き
(function () {
  try {
    var params = new URLSearchParams(window.location.search);
    var fromQuery = params.get("api");
    var keyQuery  = params.get("key");
    var gcidQuery = params.get("gcid");
    if (fromQuery) {
      API_URL = fromQuery.trim();
      try { localStorage.setItem("checkin_api_url", API_URL); } catch (e) {}
    }
    if (keyQuery) {
      ADMIN_KEY = keyQuery.trim();
      try { localStorage.setItem("checkin_admin_key", ADMIN_KEY); } catch (e) {}
    }
    if (gcidQuery) {
      GOOGLE_CLIENT_ID = gcidQuery.trim();
      try { localStorage.setItem("checkin_gcid", GOOGLE_CLIENT_ID); } catch (e) {}
    }
    if (fromQuery && gcidQuery) return; // 両方来ていれば設定完了
  } catch (e) {}
  // ② 保存済みがあれば利用
  if (!API_URL) {
    try { API_URL = localStorage.getItem("checkin_api_url") || ""; } catch (e) {}
  }
  if (!ADMIN_KEY) {
    try { ADMIN_KEY = localStorage.getItem("checkin_admin_key") || ""; } catch (e) {}
  }
  if (!GOOGLE_CLIENT_ID) {
    try { GOOGLE_CLIENT_ID = localStorage.getItem("checkin_gcid") || ""; } catch (e) {}
  }
})();

var lastId = "";
var cooldownUntil = 0; // QR処理後、次の読み取りを受け付けない期限(ms)

/* GASへのPOST: CORSプリフライトを避けるため text/plain で送る */
function callApi(body) {
  body.key = ADMIN_KEY;   // 合言葉(statsのダッシュボード互換用)
  body.idToken = idToken; // GoogleログインのIDトークン(受付操作に必須)
  return fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body)
  }).then(function (r) { return r.json(); });
}

// カウンター値を手元で保持(checkin応答に集計を含めない分、ここで管理)
var cntDone = null, cntTotal = null;

function renderCounter() {
  document.getElementById("cdone").textContent = (cntDone === null ? "-" : cntDone);
  document.getElementById("ctotal").textContent = (cntTotal === null ? "-" : cntTotal);
}

// stats オブジェクトでカウンター表示を初期化/再同期
function updateCounter(stats) {
  if (!stats) return;
  cntDone = stats.done;
  cntTotal = stats.total;
  renderCounter();
}

// 受付成功時に手元で来場数を+1(サーバーへの集計問い合わせをしない)
function incCounter() {
  if (cntDone !== null) { cntDone++; renderCounter(); }
}

// 初回のみカウンターを取得(以降は成功ごとに手元で+1)
function refresh() {
  if (!API_URL) return;
  callApi({ action: "stats" }).then(function (d) {
    if (d && d.ok) updateCounter(d.stats);
  }).catch(function () {});
}

/* ===== 効果音(Web Audioでその場合成。音声ファイル不要)===== */
var audioCtx = null;
// iOSは初回ユーザー操作時にAudioContextを生成・再開する必要がある
function initAudio() {
  try {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}
// 単音を鳴らす(周波数Hz, 開始秒, 長さ秒, 音量)
function tone(freq, start, dur, vol) {
  if (!audioCtx) return;
  var t0 = audioCtx.currentTime + start;
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol, t0 + 0.01);     // 立ち上がり
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); // 減衰
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}
// 成功音「ピロー↑ン」: 2音上昇、合計約1秒
function beepOk()   { initAudio(); tone(880, 0, 0.3, 0.3); tone(1318, 0.28, 0.72, 0.3); }
// 警告音(受付済み): 低めの2連
function beepWarn() { initAudio(); tone(660, 0, 0.12, 0.25); tone(660, 0.16, 0.12, 0.25); }
// エラー音: 下降
function beepErr()  { initAudio(); tone(400, 0, 0.18, 0.25); tone(250, 0.16, 0.25, 0.25); }

function show(res) {
  var el = document.getElementById("result");
  el.className = res.type;
  el.innerHTML =
    '<div class="rname">' + (res.name ? res.name + " 様" : "") + '</div>' +
    '<div class="rmsg">' + res.title + " : " + res.message + '</div>' +
    '<div class="rco">' + (res.company || "") + '</div>';
  // 結果に応じて効果音
  if (res.type === "ok") beepOk();
  else if (res.type === "warn") beepWarn();
  else beepErr();
}

function onScan(text) {
  var id = text;
  // QRに ?id=XXX 入りURLが入っている場合はIDだけ取り出す
  try {
    if (text.indexOf("?id=") >= 0) {
      id = decodeURIComponent(text.split("?id=")[1].split("&")[0]);
    }
  } catch (e) {}
  // 読み取り間インターバル: 直前の処理から1秒間は次の読み取りを受け付けない
  var now = Date.now();
  if (now < cooldownUntil) return;
  // 同じQRが映り続けている間は1回だけ処理。
  // QRが一度画面から外れる(handleRawでlastIDがクリアされる)と再び処理可能。
  if (id === lastId) return;
  lastId = id;
  cooldownUntil = now + 1000;

  callApi({ action: "checkin", id: id }).then(function (d) {
    if (d && d.result) {
      show(d.result);
      if (d.result.type === "ok") incCounter(); // 新規受付のみ来場数を+1
    } else if (d && d.error === "unauthorized") {
      // 未ログイン or トークン期限切れ → 再ログインを促す
      show({ type: "error", title: "ログインが必要です", message: "Googleログインの有効期限が切れました。再度ログインしてください。", name: "", company: "" });
      showSignIn("セッションの有効期限が切れました。もう一度ログインしてください。");
    } else if (d && d.error === "forbidden") {
      show({ type: "error", title: "権限がありません",
             message: (d.email || "このアカウント") + " には受付権限がありません。名簿の共有を受けたアカウントでログインしてください。",
             name: "", company: "" });
      showSignIn("別のアカウントでログインし直してください。");
    }
  }).catch(function (e) {
    show({ type: "error", title: "通信エラー", message: "サーバーに接続できません", name: "", company: "" });
  });
}

function showError(name, detail) {
  var permMsg =
    (name === "NotAllowedError") ? "カメラの使用が許可されていません。" :
    (name === "NotFoundError")   ? "カメラが見つかりませんでした。" :
    (name === "NotReadableError")? "カメラを他のアプリが使用中です。" :
    "カメラを起動できませんでした。";
  document.getElementById("err").innerHTML =
    "<b>" + permMsg + "</b>（" + detail + "）<ol>" +
    "<li>アドレスバーのカメラ/鍵アイコンから、カメラを<b>「許可」</b>に変更してください。</li>" +
    "<li>端末の設定（iPhone:設定→Safari／Android:設定→アプリ→Chrome）でカメラ権限を確認してください。</li>" +
    "<li>他のカメラ使用アプリ（ビデオ通話等）を閉じてください。</li>" +
    "</ol><button id='retry'>もう一度試す</button>";
  document.getElementById("err").style.display = "block";
  document.getElementById("retry").onclick = startScanner;
}

/* ===== カメラ起動 → BarcodeDetector優先、なければjsQR ===== */
var camVideo = null, camStream = null, scanRAF = null, canvas = null, cctx = null;
var pendingVal = "", pendingCount = 0; // 誤読防止: 同一値が2フレーム連続で確定

function startScanner() {
  initAudio();
  document.getElementById("err").style.display = "none";
  document.getElementById("result").textContent = "カメラを起動しています…";
  // 再試行などで二重起動しないよう、既存のカメラ/ループを停止
  if (scanRAF) { cancelAnimationFrame(scanRAF); scanRAF = null; }
  if (camStream) { camStream.getTracks().forEach(function (t) { t.stop(); }); camStream = null; }
  pendingVal = ""; pendingCount = 0;

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError("Error", "このブラウザはカメラに対応していません");
    return;
  }
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 1280 } }
  }).then(function (stream) {
    camStream = stream;
    var reader = document.getElementById("reader");
    reader.innerHTML = "";
    camVideo = document.createElement("video");
    camVideo.setAttribute("playsinline", "true"); // iOSで全画面化させない
    camVideo.muted = true;
    camVideo.style.width = "100%";
    camVideo.srcObject = stream;
    reader.appendChild(camVideo);
    return camVideo.play();
  }).then(function () {
    document.getElementById("result").textContent = "QRコードをカメラにかざしてください";
    // BarcodeDetectorが実際にqr_codeをサポートしていれば優先
    if ("BarcodeDetector" in window && BarcodeDetector.getSupportedFormats) {
      BarcodeDetector.getSupportedFormats().then(function (fmts) {
        if (fmts.indexOf("qr_code") >= 0) {
          runNative();
        } else {
          runJsQR();
        }
      }).catch(function () { runJsQR(); });
    } else {
      runJsQR();
    }
  }).catch(function (e) {
    showError(e.name || "Error", e.message || e);
  });
}

// 検出した生テキストを確定処理へ(誤読防止: 同一値2回連続で確定)
// QRが画面から外れる(一定フレームQR無し)と、再び同じQRを処理可能にする
var noQrFrames = 0;
function handleRaw(text) {
  if (!text) {
    pendingVal = ""; pendingCount = 0;
    noQrFrames++;
    // 連続でQRが見えなくなったら「外れた」とみなし、直前ID記憶をクリア
    if (noQrFrames >= 8) { lastId = ""; }
    return;
  }
  noQrFrames = 0;
  if (text === pendingVal) {
    pendingCount++;
  } else {
    pendingVal = text; pendingCount = 1;
  }
  if (pendingCount >= 2) {   // 2フレーム連続で同じ値なら確定
    pendingVal = ""; pendingCount = 0;
    onScan(text);
  }
}

// ネイティブ BarcodeDetector で走査
function runNative() {
  var detector;
  try { detector = new BarcodeDetector({ formats: ["qr_code"] }); }
  catch (e) { runJsQR(); return; }
  function loop() {
    detector.detect(camVideo).then(function (codes) {
      if (codes && codes.length) handleRaw(codes[0].rawValue);
    }).catch(function () {}).then(function () {
      scanRAF = requestAnimationFrame(loop);
    });
  }
  loop();
}

// jsQR で走査(canvasに描画してピクセルを解析)
function runJsQR() {
  canvas = document.createElement("canvas");
  cctx = canvas.getContext("2d", { willReadFrequently: true });
  function loop() {
    if (camVideo.readyState === camVideo.HAVE_ENOUGH_DATA && camVideo.videoWidth) {
      var w = camVideo.videoWidth, h = camVideo.videoHeight;
      // 解析負荷軽減のため最大640pxに縮小して読む
      var scale = Math.min(1, 640 / Math.max(w, h));
      var cw = Math.round(w * scale), ch = Math.round(h * scale);
      canvas.width = cw; canvas.height = ch;
      cctx.drawImage(camVideo, 0, 0, cw, ch);
      var img = cctx.getImageData(0, 0, cw, ch);
      var code = jsQR(img.data, cw, ch, { inversionAttempts: "dontInvert" });
      if (code && code.data) handleRaw(code.data);
    }
    scanRAF = requestAnimationFrame(loop);
  }
  loop();
}

/* ===== Googleログイン(GIS) ===== */
function showSignIn(msg) {
  document.getElementById("signin").style.display = "block";
  document.getElementById("signinMsg").textContent = msg || "";
  initGsi();
}

var gsiInited = false;
function initGsi() {
  if (gsiInited) return;
  if (!GOOGLE_CLIENT_ID) {
    document.getElementById("signinMsg").textContent =
      "OAuthクライアントIDが未設定です。ダッシュボードの「受付スキャン」ボタンから開き直してください。";
    return;
  }
  // gsiスクリプトの読込完了を待ってから初期化
  if (!(window.google && google.accounts && google.accounts.id)) {
    setTimeout(initGsi, 300);
    return;
  }
  gsiInited = true;
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: onGoogleCredential
  });
  google.accounts.id.renderButton(document.getElementById("gsiBtn"), {
    theme: "filled_blue", size: "large", text: "signin_with", shape: "pill"
  });
}

function onGoogleCredential(resp) {
  if (!resp || !resp.credential) return;
  idToken = resp.credential; // 以降のAPI呼び出しに添付される
  document.getElementById("signin").style.display = "none";
  startScanner();
  refresh(); // 初回カウンター取得
}

function boot() {
  if (!API_URL) {
    // URL未設定 → 設定欄を表示
    document.getElementById("result").textContent = "セットアップが必要です";
    document.getElementById("setup").style.display = "block";
    document.getElementById("apiSave").onclick = function () {
      var v = document.getElementById("apiInput").value.trim();
      if (!v) return;
      API_URL = v;
      try { localStorage.setItem("checkin_api_url", v); } catch (e) {}
      document.getElementById("setup").style.display = "none";
      boot();
    };
    return;
  }
  // Googleログインしてからスキャン開始(受付操作にはログイン必須)
  document.getElementById("result").textContent = "Googleログインをお願いします";
  showSignIn("");
}

boot();
</script>
</body>
</html>
